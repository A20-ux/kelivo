name: Release APK

# 推送 v* 标签自动出 release APK；也可在 Actions 页手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '构建后上传到该 Release 标签（留空则只保留为构建产物）'
        required: false
        type: string

env:
  FLUTTER_VERSION: '3.47.6'

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback key (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.SILICONFLOW_KEY }}" ]; then
            mkdir -p lib/secrets
            cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
            echo "fallback key injected"
          else
            echo "no SILICONFLOW_KEY secret; keep repo placeholder"
          fi

      - name: 📝 Read app version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: 🔑 Write signing key (optional)
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "no signing secret; fall back to debug signing"
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signing config written"

      - name: 📚 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: 📦 Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          shopt -s nullglob
          files=(app-*-release.apk app-release.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK found in $(pwd)"
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              app-release.apk) abi="arm64-v8a" ;;
              *) abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/') ;;
            esac
            mv "$file" "Kelivo_${VERSION}_${abi}.apk"
          done
          ls -lh

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-android-${{ env.VERSION }}
          path: build/app/outputs/flutter-apk/Kelivo_*.apk

      - name: 🚀 Publish to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/Kelivo_*.apk
